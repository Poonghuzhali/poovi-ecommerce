services:
  - type: web
    name: poovi-ecommerce-api
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn backend.wsgi:application --bind 0.0.0.0:$PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.2
      - key: DEBUG
        value: false
      - key: CORS_ALLOW_ALL_ORIGINS
        value: true
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: poovi-ecommerce-db
          property: connectionString

databases:
  - name: poovi-ecommerce-db
    plan: free
    databaseName: ecommerce
    user: ecommerce_user
