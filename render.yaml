databases:
  - name: poovi-ecommerce-db
    plan: free
    databaseName: ecommerce
    user: ecommerce_user

services:
  - type: web
    name: poovi-ecommerce-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health/
    envVars:
      - key: DEBUG
        value: "false"
      - key: CORS_ALLOW_ALL_ORIGINS
        value: "true"
      - key: ALLOWED_HOSTS
        value: ".onrender.com,localhost,127.0.0.1"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: poovi-ecommerce-db
          property: connectionString
