databases:
  - name: poovi-ecommerce-db
    plan: free
    databaseName: ecommerce
    user: ecommerce_user

services:
  - type: web
    name: poovi-ecommerce-api
    runtime: python
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt && python manage.py collectstatic --no-input
    startCommand: python manage.py migrate --no-input && python manage.py seed_products && gunicorn backend.wsgi:application --bind 0.0.0.0:$PORT --timeout 120
    healthCheckPath: /api/health/
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.2"
      - key: DEBUG
        value: "false"
      - key: CORS_ALLOW_ALL_ORIGINS
        value: "true"
      - key: ALLOWED_HOSTS
        value: ".onrender.com,localhost,127.0.0.1"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: poovi-ecommerce-db
          property: connectionString
